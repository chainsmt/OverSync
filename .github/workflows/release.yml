name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  resolver-docker:
    name: Build + push resolver Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/oversync-resolver
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Load the resolver image into the local Docker engine, then scan it with
      # Aqua Trivy (aquasecurity/trivy-action) before anything is published.
      # severity CRITICAL,HIGH plus exit-code 1 fails this job on HIGH or
      # CRITICAL findings, so the push step below does not run.
      - name: Build resolver image locally
        uses: docker/build-push-action@v6
        with:
          context: ./resolver
          file: ./resolver/Dockerfile
          load: true
          push: false
          tags: oversync-resolver:scan

      - name: Scan resolver image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oversync-resolver:scan
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ./resolver
          file: ./resolver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
